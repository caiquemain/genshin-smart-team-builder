services:
  db:
    image: postgres:16-alpine
    container_name: genshin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genshin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genshin}
      POSTGRES_DB: ${POSTGRES_DB:-genshin_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genshin} -d ${POSTGRES_DB:-genshin_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: genshin_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-genshin}:${POSTGRES_PASSWORD:-genshin}@db:5432/${POSTGRES_DB:-genshin_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: genshin_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
